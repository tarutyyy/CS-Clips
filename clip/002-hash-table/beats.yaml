voice:
  provider: voicevox
  speaker: 3                # ずんだもん（ノーマル）
  speed: 1.1
  pitch: 0.0
  intonation: 1.0
timing:
  leadIn: 0.3
  gap: 0.3
  tail: 1.0
beats:
  - id: hook
    text: 何万件のデータから、1件をほぼ一発で取り出す。どうやっているんでしょう？
    yomi: なんまんけんのデータから、いっけんをほぼいっぱつで取り出す。どうやっているんでしょう？
  - id: array
    text: 配列なら、番号さえ分かれば、その箱に直接行けます。3番なら、3番を見るだけ。
    yomi: 配列なら、番号さえ分かれば、その箱に直接行けます。さんばんなら、さんばんを見るだけ。
  - id: hashfn
    text: でも、探したいのは、appleのような文字列です。そこで、ハッシュ関数で、キーを番号に変えます。
  - id: store
    text: appleが3になったら、3番の箱に入れます。
    yomi: アップルがさんになったら、さんばんの箱に入れます。
  - id: lookup
    text: 探すときも、同じ計算で、3番の箱を見るだけ。件数が増えても、手間はほぼ同じです。
    yomi: 探すときも、同じ計算で、さんばんの箱を見るだけ。件数が増えても、手間はほぼ同じです。
  - id: collision
    text: ただし箱の数には限りがあり、別のキーが同じ番号になる「衝突」は避けられません。
  - id: chain
    text: そのときは、同じ箱につなぎます。混んだら箱を増やして入れ直すので、列は短いままです。
  - id: payoff
    text: "**キーから、置き場所を計算する**。だから、平均して、ほぼ一定の時間で見つかるんです。"
