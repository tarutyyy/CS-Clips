timing:
  leadIn: 0.3
  gap: 0.3
  tail: 1.0
beats:
  - id: hook
    text: 100万個の数から、1つを探す。たった20回比べるだけで、見つかるとしたら？
    yomi: ひゃくまんこの数から、ひとつを探す。たったにじゅっかい比べるだけで、見つかるとしたら？
  - id: linear
    text: 先頭から順に見ると、1回で減る候補は1つだけ。100万個なら、最悪100万回です。
    yomi: 先頭から順に見ると、いっかいで減る候補はひとつだけ。ひゃくまんこなら、最悪ひゃくまんかいです。
  - id: mid
    text: 二分探索は、まず真ん中と比べます。37は30より大きい。
    yomi: にぶんたんさくは、まず真ん中と比べます。さんじゅうななは、さんじゅうより大きい。
  - id: discard
    text: だから、左半分には絶対にありません。まとめて捨てられます。
  - id: half
    text: 残りの真ん中と比べて、また半分。
    gap: 0.6
  - id: found
    text: これを繰り返すと、15個なら4回で見つかります。
    yomi: これを繰り返すと、じゅうごこなら、よんかいで見つかります。
    gap: 0.5
  - id: sorted
    text: ただし、**小さい順に並んでいること**が前提です。並んでいないと、どちらを捨てればいいか決められません。
  - id: payoff
    text: "**1回で半分**になるから、100万個でも、20回ほど。データが倍になっても、増えるのは1回だけです。"
    yomi: いっかいで半分になるから、ひゃくまんこでも、にじゅっかいほど。データが倍になっても、増えるのはいっかいだけです。
