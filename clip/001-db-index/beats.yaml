beats:
  - id: hook
    text: 1億行のテーブルから、1行を探す。どれくらいかかるでしょう？
    yomi: いちおくぎょうのテーブルから、いちぎょうをさがす。どれくらいかかるでしょう？
  - id: scan
    text: インデックスがないと、先頭から順番に、全部の行を調べるしかありません。最悪、1億回です。
    yomi: インデックスがないと、先頭から順番に、全部の行を調べるしかありません。最悪、いちおっかいです。
  - id: idea
    text: そこで使うのが、インデックス。多くのデータベースでは、B+木という、木の形をしています。
  - id: fanout
    text: 1つのノードには、目印が数百個入っています。だから、枝がとても広がるんです。
    yomi: ひとつのノードには、目印がすうひゃっこ入っています。だから、枝がとても広がるんです。
  - id: descend
    text: 根から葉へ、たどるのは、たったの3〜4段。目的の行まで、4回ページを読めば届きます。
    yomi: 根から葉へ、たどるのは、たったの、さんからよんだん。目的の行まで、よんかいページを読めば届きます。
  - id: payoff
    text: 1億行でも、10億行でも、ほとんど同じ。**インデックスは、探す範囲を一気に絞る**仕組みなんです。
    yomi: いちおくぎょうでも、じゅうおくぎょうでも、ほとんど同じ。インデックスは、探す範囲を一気に絞る仕組みなんです。
